name: Milestone task
description: A small piece of work toward the current milestone
labels: [task]
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M1
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences on what this task adds.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
        - [ ] Tuning values added to tuning.json
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Not included
      description: What's deliberately left for later.
